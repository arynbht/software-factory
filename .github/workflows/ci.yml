name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format

      - name: Validate catalog
        run: pnpm catalog:validate

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check action bundle builds and catalog copy is current
        run: |
          pnpm action:build
          # The bundle itself is not byte-diffed (esbuild output varies by platform);
          # we verify it builds and is non-empty, and that the copied catalog matches.
          test -s packages/action/dist/index.js
          git diff --exit-code -- packages/action/controls packages/action/gates
