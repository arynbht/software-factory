name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        # Use bash on every OS so the multi-line scripts (and tools like `test`)
        # behave identically; Git Bash ships on the Windows runners.
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # The desktop app is built by electron-vite (not the root tsc --build graph),
      # so it carries its own typecheck. Packaging stays out of CI (release only).
      - name: Typecheck desktop
        run: pnpm --filter @arynbht/factory-desktop typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format

      - name: Validate catalog
        run: pnpm catalog:validate

      - name: Check catalog site is current
        run: |
          pnpm catalog:site
          git diff --exit-code -- docs/catalog

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check action bundle is current
        run: |
          pnpm action:build
          # The bundle bytes vary by platform, so we don't diff them directly;
          # instead we diff the copied catalog and a deterministic source hash,
          # which catches a committed bundle that wasn't rebuilt after a change.
          test -s packages/action/dist/index.js
          git diff --exit-code -- \
            packages/action/controls \
            packages/action/gates \
            packages/action/templates \
            packages/action/prompts \
            packages/action/skill \
            packages/action/dist/SOURCE_SHA256

  # Desktop end-to-end: launch the built Electron app via Playwright and drive the
  # sign-in, audit, and waive flows plus axe accessibility checks. Headless under
  # xvfb; the app runs with --no-sandbox (CI has no SUID sandbox) — packaging fuses
  # and the window sandbox are unaffected. Ubuntu only (the flows aren't OS-specific).
  desktop-e2e:
    name: desktop-e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Electron runtime libraries + xvfb
        run: |
          pnpm --filter @arynbht/factory-desktop exec playwright install-deps
          sudo apt-get install -y xvfb dbus
          # Ubuntu 24.04 runners restrict unprivileged user namespaces via AppArmor,
          # which Chromium's zygote/GPU helpers probe at startup — Electron can stall
          # before `ready` even with --no-sandbox. Lift the restriction on the runner.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Run desktop e2e (xvfb)
        # Force 24-bit color depth — Chromium/Electron won't render on xvfb's 8-bit
        # default, which otherwise leaves the window (and firstWindow) hanging. Wrap in
        # dbus-run-session: with no session bus, Electron can block before `ready`
        # (the only runtime log we saw at the stall was a D-Bus bus.cc line).
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" dbus-run-session -- pnpm --filter @arynbht/factory-desktop e2e

  # Single required status check ("ci") that gates on every matrix leg, so branch
  # protection needs just one context regardless of how many OSes the matrix runs.
  ci:
    name: ci
    needs: [build-test, desktop-e2e]
    runs-on: ubuntu-latest
    steps:
      - run: echo "all build-test legs passed"

  # Secret-scanning backstop: the pre-commit hook (lefthook + gitleaks) can be
  # bypassed with --no-verify, so CI scans the full history as well.
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
