# Changesets release. Manually dispatched for now; promote to `push: [main]` once
# "Allow GitHub Actions to create and approve pull requests" is enabled in repo
# settings (Settings → Actions → General). Publishing to a registry is a follow-up
# — the GitHub Action ships a committed bundle and needs no npm publish to work.
name: release

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# A double-dispatch must not race two Version Packages PR updates.
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Create or update the Version Packages PR
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm changeset version
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
