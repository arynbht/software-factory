# Desktop installer release (ADR-0010). Push a tag `desktop-vX.Y.Z` to build the
# Electron installers for macOS, Windows, and Linux, generate a CycloneDX SBOM,
# attest build provenance, and attach everything to the GitHub Release. The in-app
# "check for updates" reads this release through the GitHub API with the user's
# token — there is no electron-updater feed, so no `latest*.yml` is produced.
#
# Code signing is intentionally omitted for now (optional per the M5 plan): macOS
# users right-click → Open on first launch. Add notarization + Windows signing
# before any wider audience. Every action is pinned by SHA (ci.actions-pinned-sha).
name: desktop-release

on:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # create the release + upload installers
      id-token: write # provenance attestation (OIDC)
      attestations: write # provenance attestation
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The desktop main externalizes @arynbht/factory-{engine,catalog} and loads
      # them from dist at runtime; electron-vite does not build them and dist/ is
      # gitignored, so build the graph first (engine project-references catalog).
      - name: Build engine + catalog dist
        run: pnpm exec tsc --build packages/engine/tsconfig.json

      # electron-builder packages the app for the host OS. --publish never keeps it
      # from pushing anywhere; we attach artifacts explicitly below.
      - name: Package installers
        run: pnpm --filter @arynbht/factory-desktop run package -- --publish never

      # Dependency SBOM in CycloneDX (cdxgen understands pnpm-lock.yaml). Generated
      # once, on the Linux leg, since the dependency graph is OS-independent.
      - name: Generate CycloneDX SBOM
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          npx --yes @cyclonedx/cdxgen@11 -t pnpm -o apps/desktop/release/factory-desktop.cdx.json apps/desktop

      # Attach the installers (and, on Linux, the SBOM) to the Release. Create it on
      # first write; --clobber makes re-runs idempotent. shell: bash so the globbing
      # is identical on the Windows runner.
      - name: Publish to the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" \
            --title "Desktop $tag" \
            --notes "Automated desktop build. Installers are unsigned — on macOS, right-click → Open the first time. See the README for install + first-run sign-in." \
            --verify-tag || true
          assets=$(find apps/desktop/release -maxdepth 1 -type f \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' \
               -o -name '*.deb' -o -name '*.cdx.json' \))
          echo "Uploading:"; echo "$assets"
          gh release upload "$tag" $assets --clobber

      # Provenance attestation for the installers built on this runner (ADR-0010).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
