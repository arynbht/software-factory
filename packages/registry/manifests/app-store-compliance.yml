name: app-store-compliance
source: mjmirza/app-store-compliance/agent-os/skill
pin: 490a7dc76540b6ef2d27e4c8e58c24bad6d4fcc8
hash: "sha256:67043ed07c1e516721e84f22df5a6ad9d835448d462f5e0c2bec6e8052de5841"
license: LicenseRef-OpenRoots-ORA-2.3
scope: task
sectors: [legal]
phases: [review]
triggers:
  paths:
    [
      "**/Info.plist",
      "**/AndroidManifest.xml",
      "**/*.xcodeproj/**",
      "fastlane/**",
    ]
  keywords:
    [
      mobile,
      ios,
      android,
      app store,
      play store,
      testflight,
      app review,
      submission,
      rejection,
    ]
  flags: []
provides: [pre-submission-audit, rejection-fix-plan, store-policy-checklist]
conflicts: []
requires: []
commands:
  - 'bash <guard path from the table> "/path/to/app/project"'
  - "bash scripts/pull-metadata.sh apple"
  - "python3 scripts/metadata-audit.py ./metadata"
  - "python3 scripts/release-audit.py /path/to/app --metadata ./metadata"
  - "python3 scripts/monitor.py --project /path/to/app/project"
tokens: 2500
tools: [shell]
tested_on: "2026-11-09"
notes: >
  Pre-submission App Store / Google Play rejection checklist for repos with type mobile. Caveats: the
  skill directory holds only SKILL.md; the data/, docs/, references/, scripts/ and guard hook it runs
  live elsewhere in the repo, so vendoring this path alone leaves it without its scanner. Its
  "~/.factory/hooks" line is Factory Droid's home dir, not our .factory/. Source-available licence
  with a revenue royalty above USD 20M (see report).
