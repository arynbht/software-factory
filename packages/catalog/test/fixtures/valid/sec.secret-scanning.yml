id: sec.secret-scanning.pre-commit
title: Secret scanning runs before commit
lane: security
phase: scaffold
severity: high
detect:
  - type: file-matches
    path: ".pre-commit-config.yaml|lefthook.yml|.husky/pre-commit"
    pattern: "gitleaks"
evidence: none
references:
  - name: OpenSSF Scorecard
    url: https://github.com/ossf/scorecard
    section: Token-Permissions
rationale: >
  Catching leaked credentials before they are pushed is far cheaper than
  rotating them after exposure.
