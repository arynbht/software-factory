pre-commit:
  parallel: false
  commands:
    gitleaks:
      run: gitleaks git --staged --redact --no-banner

commit-msg:
  commands:
    commitlint:
      # Enforced once commitlint is installed (a Node dev dependency); a no-op
      # until then, so repos without Node aren't blocked from committing.
      run: "[ -x node_modules/.bin/commitlint ] || exit 0; node_modules/.bin/commitlint --edit {1}"
