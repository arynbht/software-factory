id: ops.runbook-per-alert
title: Runbook per alert
lane: observability
phase: operate
severity: medium
effort: medium
detect:
  - type: file-exists
    path: "docs/runbooks/**|runbooks/**"
  # Claude drafts, humans sign: a factory draft counts once it is reviewed.
  - type: reviewed
    task: runbook
evidence: none
fix:
  type: claude
  task: runbook
references:
  - name: Google SRE Workbook — On-call
    url: https://sre.google/workbook/on-call/
rationale: >
  An alert without a runbook just wakes someone up; a linked runbook turns a
  page into a procedure.
