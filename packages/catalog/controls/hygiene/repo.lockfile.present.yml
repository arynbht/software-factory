id: repo.lockfile.present
title: Dependency lockfile committed
lane: hygiene
phase: scaffold
severity: medium
effort: small
# Only once the repo declares dependencies: an empty repo has nothing to lock.
applies:
  file: "package.json|pyproject.toml|requirements.txt|Pipfile|go.mod|Cargo.toml"
detect:
  - type: any-of
    detect:
      - type: file-exists
        path: "pnpm-lock.yaml|package-lock.json|yarn.lock|npm-shrinkwrap.json|bun.lockb|bun.lock|Cargo.lock|poetry.lock|uv.lock|pdm.lock|Pipfile.lock|go.sum|Gemfile.lock"
      # A fully pinned requirements file (pip-compile output) is a Python lockfile.
      - type: file-matches
        path: "requirements.txt|requirements.lock"
        pattern: '(?m)^[A-Za-z0-9_.\-\[\]]+==[^\s]+'
evidence: none
fix:
  type: command
  byStack:
    node: npm install --package-lock-only --ignore-scripts
    go: go mod tidy
    rust: cargo generate-lockfile
references:
  - name: OpenSSF Scorecard
    url: https://github.com/ossf/scorecard/blob/main/docs/checks.md
    section: Pinned-Dependencies
rationale: >
  A committed lockfile pins the exact dependency tree so every install and CI run
  is reproducible and resistant to surprise upstream changes.
