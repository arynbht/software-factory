id: repo.lockfile.present
title: Dependency lockfile committed
lane: hygiene
phase: scaffold
severity: medium
effort: small
detect:
  - type: file-exists
    path: "pnpm-lock.yaml|package-lock.json|yarn.lock|npm-shrinkwrap.json|bun.lockb|Cargo.lock|poetry.lock|uv.lock|go.sum|Gemfile.lock"
evidence: none
fix:
  type: command
  run: npm install
references:
  - name: OpenSSF Scorecard
    url: https://github.com/ossf/scorecard/blob/main/docs/checks.md
    section: Pinned-Dependencies
rationale: >
  A committed lockfile pins the exact dependency tree so every install and CI run
  is reproducible and resistant to surprise upstream changes.
