id: dev.formatter.configured
title: Formatter configured
lane: development
phase: scaffold
severity: low
effort: small
applies:
  any:
    - stack: node
    - stack: python
    - stack: go
    - stack: rust
detect:
  - type: any-of
    detect:
      - type: file-exists
        path: ".prettierrc|.prettierrc.json|.prettierrc.js|.prettierrc.cjs|.prettierrc.yaml|prettier.config.js|prettier.config.cjs|prettier.config.mjs|biome.json|biome.jsonc|ruff.toml|.ruff.toml|rustfmt.toml|.rustfmt.toml"
      - type: file-matches
        path: "pyproject.toml"
        pattern: '\[tool\.(ruff|black)'
      # gofmt ships with the Go toolchain and has no configuration.
      - type: file-exists
        path: "go.mod"
evidence: none
fix:
  type: template
  template: formatter
references:
  - name: Prettier — Why Prettier?
    url: https://prettier.io/docs/why-prettier
rationale: >
  An enforced formatter ends style debates and keeps diffs focused on behavioural
  changes rather than reformatting churn.
