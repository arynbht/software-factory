id: dev.env-example
title: .env.example present
lane: development
phase: scaffold
severity: low
effort: small
detect:
  - type: file-exists
    path: ".env.example|.env.sample|.env.template|.env.dist"
evidence: none
fix:
  type: template
  template: env-example
references:
  - name: Twelve-Factor App — Config
    url: https://12factor.net/config
rationale: >
  An .env.example documents required configuration without committing secrets, so
  a fresh clone knows exactly which environment variables to set.
