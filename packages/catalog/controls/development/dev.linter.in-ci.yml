id: dev.linter.in-ci
title: Linter runs in CI
lane: development
phase: build
severity: medium
effort: small
detect:
  - type: file-matches
    path: ".github/workflows/*.yml|.github/workflows/*.yaml"
    pattern: '(?i)(eslint|biome|ruff|golangci-lint|\blint\b)'
evidence: none
fix:
  type: merge-yaml
  file: .github/workflows/ci.yml
  path: jobs.ci.steps
  mergeStrategy: append-if-missing
  dedupeKey: name
  byStack:
    node:
      name: Lint
      run: npm run lint --if-present
    python:
      name: Lint
      run: ruff check .
references:
  - name: DORA — Continuous integration
    url: https://dora.dev/capabilities/continuous-integration/
rationale: >
  Running the linter in CI, not just locally, makes the standard enforceable on
  every pull request regardless of each contributor's local setup.
