id: docs.runbooks-dir
title: Runbooks directory exists
lane: documentation
phase: harden
severity: medium
effort: medium
detect:
  - type: file-exists
    path: "docs/runbooks/**|runbooks/**|docs/ops/**"
evidence: none
fix:
  type: claude
  task: runbook
references:
  - name: Google SRE Workbook — On-call
    url: https://sre.google/workbook/on-call/
rationale: >
  Runbooks turn 3am incidents from improvisation into a checklist; a
  dedicated directory makes them discoverable when they are needed most.
