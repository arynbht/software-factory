id: quality.lint.clean
title: Lint passes
lane: quality
phase: build
severity: high
effort: small
applies:
  any:
    - stack: node
    - stack: python
    - stack: go
    - stack: rust
detect:
  # Runs the repo's linter and requires exit 0 — a config file alone proves
  # nothing. Node repos run their own `lint` script; a missing script fails.
  - type: command
    byStack:
      node: npm run lint
      python: ruff check .
      go: go vet ./...
      rust: cargo clippy --all-targets -- -D warnings
    timeout: 600
evidence: none
references:
  - name: Google — Software Engineering at Google (Static Analysis)
    url: https://abseil.io/resources/swe-book/html/ch20.html
    section: Tricorder
rationale: >
  A linter only protects the codebase when its findings block a change. Checking
  that lint passes, rather than that a config exists, is what stops sloppy code
  from merging.
