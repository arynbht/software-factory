id: cloud.least-privilege-iam
title: Least-privilege IAM reviewed
lane: cloud
phase: harden
severity: high
effort: medium
# Only for software that runs as a deployed service, not a library or CLI.
applies:
  any:
    - type: web-app
    - type: api
    - type: data-pipeline
    - flag: multi-service
    - file: "Dockerfile|**/Dockerfile|docker-compose*.y*ml|**/*.tf|fly.toml|render.yaml|railway.json|vercel.json|app.yaml|cloudbuild*.y*ml|k8s/**|helm/**"
detect:
  - type: manual
evidence: required
references:
  - name: AWS — IAM best practices
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html
rationale: >
  Over-broad roles are the blast radius of every breach; a periodic
  least-privilege review keeps permissions scoped to what is actually used.
