id: cloud.cost-budget-alert
title: Cost budget alert configured
lane: cloud
phase: operate
severity: low
effort: small
# Only for software that runs as a deployed service, not a library or CLI.
applies:
  any:
    - type: web-app
    - type: api
    - type: data-pipeline
    - flag: multi-service
    - file: "Dockerfile|**/Dockerfile|docker-compose*.y*ml|**/*.tf|fly.toml|render.yaml|railway.json|vercel.json|app.yaml|cloudbuild*.y*ml|k8s/**|helm/**"
detect:
  - type: manual
evidence: required
references:
  - name: FinOps Foundation — Framework
    url: https://www.finops.org/framework/
rationale: >
  A budget alert is the smoke detector for runaway spend; without one, the
  first signal is the invoice.
