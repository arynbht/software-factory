id: ci.workflow-permissions
title: Workflow token permissions declared
lane: cicd
phase: harden
severity: medium
effort: small
detect:
  - type: file-yaml-path
    file: ".github/workflows/*.yml|.github/workflows/*.yaml"
    exclude: ".github/workflows/factory.yml|.github/workflows/factory.yaml"
    path: permissions
    all: true
  - type: file-yaml-path
    file: ".github/workflows/*.yml|.github/workflows/*.yaml"
    exclude: ".github/workflows/factory.yml|.github/workflows/factory.yaml"
    path: permissions
    matches: '^(?!"?write-all"?$)'
    all: true
evidence: none
fix:
  type: merge-yaml
  file: .github/workflows/ci.yml
  path: permissions
  value:
    contents: read
references:
  - name: OpenSSF Scorecard
    url: https://github.com/ossf/scorecard/blob/main/docs/checks.md
    section: Token-Permissions
rationale: >
  An explicit permissions block scopes the workflow's GITHUB_TOKEN to least
  privilege, limiting the blast radius if a step or dependency is compromised.
