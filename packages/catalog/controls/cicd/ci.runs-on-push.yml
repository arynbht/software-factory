id: ci.runs-on-push
title: CI runs on push
lane: cicd
phase: scaffold
severity: medium
effort: small
detect:
  - type: file-matches
    path: ".github/workflows/*.yml|.github/workflows/*.yaml"
    pattern: '(?im)^\s*push:'
evidence: none
references:
  - name: GitHub Docs — Events that trigger workflows (push)
    url: https://docs.github.com/actions/using-workflows/events-that-trigger-workflows#push
rationale: >
  A push trigger keeps the mainline continuously verified, catching breakage
  introduced by merges. (This heuristic detects any push trigger; confirming it
  targets the default branch specifically is left to a future structured check.)
