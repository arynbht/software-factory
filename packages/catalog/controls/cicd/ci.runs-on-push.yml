id: ci.runs-on-push
title: CI runs on the default branch
lane: cicd
phase: scaffold
severity: medium
effort: small
detect:
  - type: file-matches
    path: ".github/workflows/*.yml|.github/workflows/*.yaml"
    pattern: '(?im)^\s*push:'
evidence: none
references:
  - name: GitHub Docs — Events that trigger workflows (push)
    url: https://docs.github.com/actions/using-workflows/events-that-trigger-workflows#push
rationale: >
  Running CI on pushes to the default branch catches breakage introduced by
  merges and keeps the main line continuously verified.
