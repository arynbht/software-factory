id: sec.sbom.ci
title: SBOM generated in CI
lane: security
phase: harden
severity: low
effort: medium
detect:
  - type: file-matches
    path: ".github/workflows/*.yml|.github/workflows/*.yaml"
    pattern: '(?i)(cyclonedx|\bsbom\b|anchore/sbom-action|syft)'
evidence: none
fix:
  type: merge-yaml
  file: .github/workflows/ci.yml
  path: jobs.ci.steps
  mergeStrategy: append-if-missing
  dedupeKey: name
  value:
    name: Generate SBOM
    uses: anchore/sbom-action@55dc4ee22412511ee8c3142cbea40418e6cec693 # v0.17.8
    with:
      format: cyclonedx-json
references:
  - name: CycloneDX
    url: https://cyclonedx.org/
  - name: SLSA specification
    url: https://slsa.dev/spec
rationale: >
  A per-build software bill of materials lets you answer "are we affected?" for a
  new CVE in seconds instead of auditing the dependency tree by hand.
