id: sec.secret-scanning.ci
title: Secret scanning runs in CI
lane: security
phase: harden
severity: medium
effort: small
detect:
  - type: file-matches
    path: ".github/workflows/*.yml|.github/workflows/*.yaml"
    pattern: "(?i)(gitleaks|trufflehog|ggshield)"
evidence: none
# gitleaks needs full history to scan the diff, so it pairs with a checkout at
# fetch-depth 0; the scan step alone satisfies the control and the full-history
# checkout is handled by the complete ci-workflow template on fresh repos.
fix:
  type: merge-yaml
  file: .github/workflows/ci.yml
  path: jobs.ci.steps
  mergeStrategy: append-if-missing
  dedupeKey: name
  value:
    name: Secret scan
    uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
references:
  - name: gitleaks — GitHub Action
    url: https://github.com/gitleaks/gitleaks-action
rationale: >
  A CI secret scan is a backstop for anything that slips past local hooks and
  catches secrets introduced by contributors without the hooks installed.
