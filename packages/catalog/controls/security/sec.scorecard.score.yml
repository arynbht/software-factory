id: sec.scorecard.score
title: OpenSSF Scorecard "Maintained" check above threshold
lane: security
phase: harden
severity: low
effort: medium
detect:
  - type: scorecard
    check: Maintained
    min: 5
evidence: none
references:
  - name: OpenSSF Scorecard
    url: https://github.com/ossf/scorecard
rationale: >
  OpenSSF Scorecard's "Maintained" check is a comparable signal that the project
  is actively maintained (recent commits/releases), a strong proxy for whether
  security issues will be addressed. Other checks can be gated as separate controls.
