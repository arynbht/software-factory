id: sec.sast.ci
title: SAST runs in CI
lane: security
phase: harden
severity: high
effort: medium
detect:
  - type: any-of
    detect:
      - type: file-yaml-path
        file: ".github/workflows/*.yml|.github/workflows/*.yaml"
        exclude: ".github/workflows/factory.yml|.github/workflows/factory.yaml"
        path: "jobs.*.steps[*].uses"
        matches: "(?i)^(github/codeql-action/analyze|returntocorp/semgrep-action|semgrep/semgrep|SonarSource/)"
      - type: file-yaml-path
        file: ".github/workflows/*.yml|.github/workflows/*.yaml"
        exclude: ".github/workflows/factory.yml|.github/workflows/factory.yaml"
        path: "jobs.*.steps[*].run"
        matches: '(?i)\bsemgrep (ci|scan)\b'
evidence: none
# CodeQL needs an init step and an analyze step; append both as a list (only the
# missing ones are added, matched by name).
fix:
  type: merge-yaml
  file: .github/workflows/ci.yml
  path: jobs.ci.steps
  mergeStrategy: append-if-missing
  dedupeKey: name
  value:
    - name: Initialize CodeQL
      uses: github/codeql-action/init@6825d5659bf007b85a0866e2d0f434aacf50de94 # v3.27.5
    - name: Perform CodeQL analysis
      uses: github/codeql-action/analyze@6825d5659bf007b85a0866e2d0f434aacf50de94 # v3.27.5
references:
  - name: OpenSSF Scorecard
    url: https://github.com/ossf/scorecard/blob/main/docs/checks.md
    section: SAST
  - name: NIST SSDF
    url: https://csrc.nist.gov/projects/ssdf
rationale: >
  Static analysis in CI finds injection, unsafe-API, and other vulnerability
  patterns automatically on every change, before they ship.
