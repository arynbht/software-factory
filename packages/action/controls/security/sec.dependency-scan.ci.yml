id: sec.dependency-scan.ci
title: Dependency vulnerability scan in CI
lane: security
phase: harden
severity: high
effort: small
detect:
  - type: any-of
    detect:
      - type: file-yaml-path
        file: ".github/workflows/*.yml|.github/workflows/*.yaml"
        exclude: ".github/workflows/factory.yml|.github/workflows/factory.yaml"
        path: "jobs.*.steps[*].uses"
        matches: "(?i)^(google/osv-scanner|aquasecurity/trivy-action|snyk/actions|actions/dependency-review-action|anchore/scan-action)"
      - type: file-yaml-path
        file: ".github/workflows/*.yml|.github/workflows/*.yaml"
        exclude: ".github/workflows/factory.yml|.github/workflows/factory.yaml"
        path: "jobs.*.steps[*].run"
        matches: '(?i)\b(osv-scanner|npm audit|pnpm audit|yarn audit|pip-audit|govulncheck|cargo audit|trivy|grype)\b'
evidence: none
# dependency-review runs on pull_request; this is a GitHub-native, stack-agnostic
# scan, so no per-stack variant is needed.
fix:
  type: merge-yaml
  file: .github/workflows/ci.yml
  path: jobs.ci.steps
  mergeStrategy: append-if-missing
  dedupeKey: name
  value:
    name: Dependency review
    uses: actions/dependency-review-action@3b139cfc5fae8b618d3eae3675e383bb1769c019 # v4.5.0
references:
  - name: OSV-Scanner
    url: https://google.github.io/osv-scanner/
  - name: OWASP ASVS
    url: https://owasp.org/www-project-application-security-verification-standard/
rationale: >
  Scanning dependencies for known vulnerabilities on every build surfaces
  exploitable CVEs in third-party code while they are cheap to fix.
