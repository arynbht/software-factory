id: sec.secret-scanning.pre-commit
title: Secret scanning runs before commit
lane: security
phase: scaffold
severity: high
effort: small
detect:
  - type: file-matches
    path: "lefthook.yml|lefthook.yaml|.lefthook.yml|.pre-commit-config.yaml|.husky/pre-commit"
    pattern: "(?i)(gitleaks|trufflehog|detect-secrets|ggshield)"
evidence: none
fix:
  type: template
  template: lefthook
references:
  - name: gitleaks
    url: https://github.com/gitleaks/gitleaks
rationale: >
  Catching leaked credentials before they are pushed is far cheaper than rotating
  them after exposure; leaked secrets are a leading cause of repo compromise.
