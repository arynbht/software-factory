id: a11y.screen-reader.pass
title: Screen-reader pass on key flows recorded
lane: accessibility
phase: build
severity: high
effort: large
applies:
  all:
    - flag: has-users
detect:
  - type: manual
evidence: required
references:
  - name: WebAIM — Screen Reader Testing
    url: https://webaim.org/articles/screenreader_testing/
rationale: >
  Screen-reader testing on core journeys catches semantics and labeling issues
  that automation misses; it is human judgement and must be recorded as evidence.
