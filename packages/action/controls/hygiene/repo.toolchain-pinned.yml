id: repo.toolchain-pinned
title: Toolchain version pinned
lane: hygiene
phase: scaffold
severity: low
effort: small
applies:
  any:
    - stack: node
    - stack: python
    - stack: go
    - stack: rust
detect:
  - type: any-of
    detect:
      - type: file-exists
        path: ".nvmrc|.node-version|.tool-versions|rust-toolchain.toml|rust-toolchain|.python-version|.devcontainer/devcontainer.json|mise.toml|.mise.toml"
      - type: file-matches
        path: "package.json"
        pattern: '"(engines|packageManager)"\s*:'
      - type: file-matches
        path: "pyproject.toml"
        pattern: "requires-python"
      # go.mod's `go` directive pins the toolchain version.
      - type: file-matches
        path: "go.mod"
        pattern: '(?m)^go \d'
evidence: none
fix:
  type: template
  template: toolchain
references:
  - name: Twelve-Factor App — Dependencies
    url: https://12factor.net/dependencies
rationale: >
  Pinning the language/runtime version keeps local, CI, and teammate environments
  identical and avoids "works on my machine" drift.
