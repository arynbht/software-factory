id: repo.codeowners.present
title: CODEOWNERS present
lane: hygiene
phase: scaffold
severity: low
effort: small
detect:
  - type: file-matches
    path: "CODEOWNERS|.github/CODEOWNERS|docs/CODEOWNERS"
    # A rule line naming a real owner; the template placeholder does not count.
    pattern: '(?m)^\s*[^#\s]\S*\s+@[\w./-]+'
    absent: '@OWNER\b'
evidence: none
fix:
  type: template
  template: codeowners
references:
  - name: GitHub Docs — About code owners
    url: https://docs.github.com/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/about-code-owners
rationale: >
  A CODEOWNERS file routes review requests to the people responsible for each
  path, so changes are not merged without an accountable reviewer.
