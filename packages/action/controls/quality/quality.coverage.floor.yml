id: quality.coverage.floor
title: Coverage at or above the floor
lane: quality
phase: harden
severity: medium
effort: medium
applies:
  any:
    - stack: node
    - stack: python
    - stack: go
    - stack: rust
detect:
  # Floor: profile `quality.coverage`, else the baseline `factory audit` records
  # in .factory/quality.json at the first measured run (it only moves up). In the
  # judge, a configured-but-missing summary after the test run fails.
  - type: coverage
evidence: none
references:
  - name: Google Testing Blog — Code Coverage Best Practices
    url: https://testing.googleblog.com/2020/08/code-coverage-best-practices.html
    section: Is a code coverage of X% good enough?
rationale: >
  Coverage doesn't prove tests are good, but a falling number shows untested
  code arriving. A floor keeps new work from lowering it.
