id: quality.tests.pass
title: Tests pass
lane: quality
phase: build
severity: critical
effort: small
applies:
  any:
    - stack: node
    - stack: python
    - stack: go
    - stack: rust
detect:
  - type: command
    byStack:
      node: npm test
      python: pytest -q
      go: go test ./...
      rust: cargo test
    timeout: 1200
evidence: none
references:
  - name: Google — Software Engineering at Google (Testing Overview)
    url: https://abseil.io/resources/swe-book/html/ch11.html
    section: Why Do We Write Tests?
rationale: >
  A test suite that isn't run, or is allowed to stay red, gives no protection.
  Requiring a green run on every change is the minimum bar for changing code
  with confidence.
