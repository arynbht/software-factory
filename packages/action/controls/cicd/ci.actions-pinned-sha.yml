id: ci.actions-pinned-sha
title: GitHub Actions pinned by commit SHA
lane: cicd
phase: harden
severity: medium
effort: medium
detect:
  - type: file-yaml-path
    file: ".github/workflows/*.yml|.github/workflows/*.yaml"
    exclude: ".github/workflows/factory.yml|.github/workflows/factory.yaml"
    path: "jobs.*.steps[*].uses"
    # Every action, not just one: local (./) and docker:// references are exact already.
    matches: '^(\./|docker://|[^@\s]+@[0-9a-f]{40}$)'
    all: true
evidence: none
# Appends a SHA-pinned hardening step. This cannot rewrite existing tag-pinned
# `uses:` lines (Renovate's `helpers:pinGitHubActionDigests` does that), but it
# seeds the workflow with a correctly SHA-pinned action and an auditing step.
fix:
  type: merge-yaml
  file: .github/workflows/ci.yml
  path: jobs.ci.steps
  mergeStrategy: append-if-missing
  dedupeKey: name
  value:
    name: Harden the runner
    uses: step-security/harden-runner@91182cccc01eb5e619899d80e4e971d6181294a7 # v2.10.1
    with:
      egress-policy: audit
references:
  - name: OpenSSF Scorecard
    url: https://github.com/ossf/scorecard/blob/main/docs/checks.md
    section: Pinned-Dependencies
  - name: GitHub Docs — Security hardening for GitHub Actions
    url: https://docs.github.com/actions/security-guides/security-hardening-for-github-actions#using-third-party-actions
rationale: >
  Pinning third-party actions to a full commit SHA, not a mutable tag, stops a
  compromised or retagged action from silently executing new code in CI.
