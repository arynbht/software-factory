id: ci.dependency-caching
title: CI caches dependencies
lane: cicd
phase: build
severity: low
effort: small
detect:
  - type: file-matches
    path: ".github/workflows/*.yml|.github/workflows/*.yaml"
    pattern: '(?i)(actions/cache|cache:\s|cache-dependency-path)'
evidence: none
references:
  - name: GitHub Docs — Caching dependencies to speed up workflows
    url: https://docs.github.com/actions/using-workflows/caching-dependencies-to-speed-up-workflows
rationale: >
  Caching dependencies cuts CI time and cost and reduces load on upstream
  registries, keeping the feedback loop fast as the project grows.
