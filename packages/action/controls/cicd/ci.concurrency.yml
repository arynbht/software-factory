id: ci.concurrency
title: CI cancels superseded runs
lane: cicd
phase: build
severity: low
effort: small
detect:
  - type: any-of
    detect:
      - type: file-yaml-path
        file: ".github/workflows/*.yml|.github/workflows/*.yaml"
        exclude: ".github/workflows/factory.yml|.github/workflows/factory.yaml"
        path: concurrency
      - type: file-yaml-path
        file: ".github/workflows/*.yml|.github/workflows/*.yaml"
        exclude: ".github/workflows/factory.yml|.github/workflows/factory.yaml"
        path: "jobs.*.concurrency"
evidence: none
fix:
  type: merge-yaml
  file: .github/workflows/ci.yml
  path: concurrency
  value:
    group: "${{ github.workflow }}-${{ github.ref }}"
    cancel-in-progress: true
references:
  - name: GitHub Docs — Using concurrency
    url: https://docs.github.com/actions/using-jobs/using-concurrency
rationale: >
  A concurrency group cancels superseded in-progress runs on the same ref, saving
  runner minutes and giving faster feedback on the latest commit.
