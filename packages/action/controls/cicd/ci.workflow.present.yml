id: ci.workflow.present
title: CI workflow present
lane: cicd
phase: scaffold
severity: high
effort: small
detect:
  - type: file-exists
    path: ".github/workflows/*.yml|.github/workflows/*.yaml"
    # The factory's own self-audit workflow (written by `init`) must not satisfy
    # this control, or the `ci-workflow` fix would never scaffold a real CI
    # workflow that runs tests/lint/build. See issue #62.
    exclude: ".github/workflows/factory.yml|.github/workflows/factory.yaml"
evidence: none
fix:
  type: template
  template: ci-workflow
references:
  - name: DORA — Continuous integration
    url: https://dora.dev/capabilities/continuous-integration/
rationale: >
  A CI workflow is the foundation for every automated gate; without one, nothing
  (tests, lint, security scans) is enforced on changes.
