id: dev.linter.configured
title: Linter configured
lane: development
phase: scaffold
severity: medium
effort: small
applies:
  any:
    - stack: node
    - stack: python
    - stack: go
    - stack: rust
detect:
  - type: any-of
    detect:
      - type: file-exists
        path: "eslint.config.js|eslint.config.mjs|eslint.config.cjs|eslint.config.ts|.eslintrc|.eslintrc.json|.eslintrc.js|.eslintrc.cjs|biome.json|biome.jsonc|ruff.toml|.ruff.toml|.flake8|.pylintrc|.golangci.yml|.golangci.yaml|.golangci.toml|clippy.toml|.clippy.toml"
      - type: file-matches
        path: "pyproject.toml|setup.cfg|tox.ini"
        pattern: '\[(tool\.)?(ruff|flake8|pylint)'
      - type: file-matches
        path: "Cargo.toml"
        pattern: '\[(workspace\.)?lints'
evidence: none
fix:
  type: template
  template: linter
references:
  - name: Twelve-Factor App — Dev/prod parity
    url: https://12factor.net/dev-prod-parity
rationale: >
  A configured linter catches a class of bugs and style drift before review,
  keeping the codebase consistent as it and the team grow.
