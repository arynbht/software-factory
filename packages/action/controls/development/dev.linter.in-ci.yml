id: dev.linter.in-ci
title: Linter runs in CI
lane: development
phase: build
severity: medium
effort: small
applies:
  any:
    - stack: node
    - stack: python
    - stack: go
    - stack: rust
detect:
  - type: any-of
    detect:
      - type: file-yaml-path
        file: ".github/workflows/*.yml|.github/workflows/*.yaml"
        exclude: ".github/workflows/factory.yml|.github/workflows/factory.yaml"
        path: "jobs.*.steps[*].uses"
        matches: "(?i)^(golangci/golangci-lint-action|biomejs/setup-biome)"
      - type: file-yaml-path
        file: ".github/workflows/*.yml|.github/workflows/*.yaml"
        exclude: ".github/workflows/factory.yml|.github/workflows/factory.yaml"
        path: "jobs.*.steps[*].run"
        matches: '(?is)^(?!.*--if-present).*\b(eslint|biome (check|lint|ci)|ruff check|flake8|pylint|golangci-lint|go vet|cargo clippy|(npm|pnpm|yarn)( run)? lint)\b'
evidence: none
fix:
  type: merge-yaml
  file: .github/workflows/ci.yml
  path: jobs.ci.steps
  mergeStrategy: append-if-missing
  # Deduplicate on the command, not the step name: a "Lint" step that can't
  # fail (`--if-present`) mustn't stop the real one being added.
  dedupeKey: run
  byStack:
    node:
      name: Lint
      run: npm run lint
    python:
      name: Lint
      run: ruff check .
references:
  - name: DORA — Continuous integration
    url: https://dora.dev/capabilities/continuous-integration/
rationale: >
  Running the linter in CI, not just locally, makes the standard enforceable on
  every pull request regardless of each contributor's local setup.
