id: perf.caching-strategy
title: Caching strategy documented
lane: performance
phase: harden
severity: low
effort: small
# Only for software that runs as a deployed service, not a library or CLI.
applies:
  any:
    - type: web-app
    - type: api
    - type: data-pipeline
    - flag: multi-service
    - file: "Dockerfile|**/Dockerfile|docker-compose*.y*ml|**/*.tf|fly.toml|render.yaml|railway.json|vercel.json|app.yaml|cloudbuild*.y*ml|k8s/**|helm/**"
detect:
  - type: file-matches
    path: "docs/**/*.md|README*|ARCHITECTURE*"
    pattern: "(?i)(cache|caching|cdn|cache-control|etag|redis)"
evidence: none
references:
  - name: MDN — HTTP caching
    url: https://developer.mozilla.org/en-US/docs/Web/HTTP/Caching
rationale: >
  A written caching strategy (layers, TTLs, invalidation) prevents the two
  classic failures: no caching, and caching that serves stale data.
