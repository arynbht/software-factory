id: perf.load-test-before-launch
title: Load test at expected peak before launch
lane: performance
phase: launch
severity: medium
effort: medium
# Only for software that runs as a deployed service, not a library or CLI.
applies:
  any:
    - type: web-app
    - type: api
    - type: data-pipeline
    - flag: multi-service
    - file: "Dockerfile|**/Dockerfile|docker-compose*.y*ml|**/*.tf|fly.toml|render.yaml|railway.json|vercel.json|app.yaml|cloudbuild*.y*ml|k8s/**|helm/**"
detect:
  - type: manual
evidence: required
references:
  - name: k6 — Load testing
    url: https://grafana.com/docs/k6/latest/
rationale: >
  Finding the breaking point in a load test is far cheaper than finding it
  with real users on launch day.
