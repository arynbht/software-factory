id: data.backup-restore-drill
title: Data backup restore drill performed
lane: data
phase: operate
severity: high
effort: medium
# Only when the project stores data: it handles PII, or the repo shows a datastore.
applies:
  any:
    - flag: handles-pii
    - file: "**/migrations/**|prisma/schema.prisma|**/alembic.ini|**/alembic/**|knexfile.*|drizzle.config.*|ormconfig.*|**/schema.sql|**/db/schema.rb"
detect:
  - type: manual
evidence: required
references:
  - name: Google SRE Book — Data Integrity
    url: https://sre.google/sre-book/data-integrity/
rationale: >
  Restoring real data in a drill is the only proof the backup strategy works;
  it ages out via valid-for so it is repeated, not assumed.
