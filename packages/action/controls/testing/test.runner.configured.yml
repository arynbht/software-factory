id: test.runner.configured
title: Test runner configured
lane: testing
phase: build
severity: medium
effort: small
applies:
  any:
    - stack: node
    - stack: python
    - stack: go
    - stack: rust
detect:
  - type: any-of
    detect:
      - type: file-matches
        path: "package.json"
        pattern: '"test"\s*:\s*"(?![^"]*no test specified)[^"]*\b(vitest|jest|mocha|ava|playwright|node --test|c8|nyc|tap|jasmine|karma|bun test)\b'
      - type: file-matches
        path: "pyproject.toml|setup.cfg|tox.ini|pytest.ini"
        pattern: '\[(tool[.:])?pytest'
      - type: file-exists
        path: "conftest.py|**/conftest.py|test_*.py|*_test.py|tests/**/test_*.py|test/**/test_*.py|tests/**/*_test.py"
      - type: file-exists
        path: "**/*_test.go"
      - type: file-matches
        path: "src/**/*.rs|tests/**/*.rs"
        pattern: '#\[(test|cfg\(test\))\]'
evidence: none
references:
  - name: Google — Software Engineering at Google (Testing)
    url: https://abseil.io/resources/swe-book/html/ch11.html
rationale: >
  A configured, runnable test suite is the baseline for changing code with
  confidence; without one, every change is a guess.
