id: test.runner.in-ci
title: Tests run in CI
lane: testing
phase: build
severity: medium
effort: small
applies:
  any:
    - stack: node
    - stack: python
    - stack: go
    - stack: rust
detect:
  - type: file-yaml-path
    file: ".github/workflows/*.yml|.github/workflows/*.yaml"
    exclude: ".github/workflows/factory.yml|.github/workflows/factory.yaml"
    path: "jobs.*.steps[*].run"
    # `--if-present` would pass with no test script at all, so it doesn't count.
    matches: '(?is)^(?!.*--if-present).*\b(vitest|jest|pytest|go test|cargo test|(npm|pnpm|yarn)( run)? test|node --test|tox|nox)\b'
evidence: none
fix:
  type: merge-yaml
  file: .github/workflows/ci.yml
  path: jobs.ci.steps
  mergeStrategy: append-if-missing
  dedupeKey: name
  byStack:
    node:
      name: Test
      run: npm test --if-present
    python:
      name: Test
      run: pytest
references:
  - name: DORA — Continuous integration
    url: https://dora.dev/capabilities/continuous-integration/
rationale: >
  Tests that only run locally do not protect the main line; running them in CI is
  what makes a green suite a precondition for merging.
