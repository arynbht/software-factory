id: ux.responsive.breakpoints
title: Responsive breakpoints defined
lane: ux
phase: design
severity: low
effort: small
applies:
  all:
    - flag: public-facing
detect:
  - type: file-matches
    path: "**/*.css|**/*.scss|**/tailwind.config.*|**/*.{ts,tsx}"
    pattern: '(?i)(@media|breakpoint|min-width|max-width|sm:|md:|lg:)'
references:
  - name: web.dev — Responsive design basics
    url: https://web.dev/articles/responsive-web-design-basics
rationale: >
  Explicit breakpoints keep the layout usable across the range of device sizes
  users actually bring, instead of breaking at widths no one tested.
